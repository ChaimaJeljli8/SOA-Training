type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}
enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}
type Module {
    matricule: String
    nom: String
    coefficient: Int
    volumeHoraire: Int
    type: TypeModule
    uniteEnseignement: UniteEnseignement
}

type QueryResolver {
    allUEs: [UniteEnseignement]
     allModules: [Module]
        modulesByType(type: TypeModule!): [Module]
        moduleByMatricule(matricule: String!): Module
}

type MutationResolver {
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    addModule(
            matricule: String!
            libelle: String!
            coef: Int!
            volumeHoraire: Int!
            codeUE: Int!
            type: TypeModule!
        ): Boolean

        updateModule(
            matricule: String!
            libelle: String!
            coef: Int!
            volumeHoraire: Int!
            codeUE: Int!
            type: TypeModule!
        ): Module

        deleteModule(matricule: String!): String

}
schema {
    query: QueryResolver
    mutation: MutationResolver
}
